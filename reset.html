<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワードリセット</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hiragino Sans',sans-serif;background:#f7f9fc;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.card{background:#fff;border-radius:14px;border:1px solid #e8edf4;padding:2rem 1.5rem;width:100%;max-width:360px}
h1{font-size:1.2rem;font-weight:700;color:#0f1c35;margin-bottom:.25rem}
.sub{font-size:.85rem;color:#7a8a9e;margin-bottom:1.75rem}
label{font-size:.82rem;color:#5a6a82;display:block;margin-bottom:4px}
input{width:100%;border:1px solid #d8e2f0;border-radius:8px;padding:10px 12px;font-size:.9rem;color:#0f1c35;margin-bottom:1rem;outline:none}
.btn{width:100%;background:#1a5cd4;color:#fff;border:none;border-radius:8px;padding:12px;font-size:.95rem;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6}
.msg{font-size:.82rem;margin-top:1rem;text-align:center}
.err{color:#e24b4a}
.ok{color:#1d9e75}
.back{font-size:.82rem;color:#1a5cd4;text-align:center;margin-top:1rem;cursor:pointer}

/* 新パスワード設定フォーム */
#new-pw-form{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>パスワードリセット</h1>

  <!-- ステップ1：メール送信 -->
  <div id="email-form">
    <p class="sub">登録済みのメールアドレスを入力してください。リセット用のリンクを送信します。</p>
    <label>メールアドレス</label>
    <input type="email" id="em" placeholder="example@email.com">
    <button class="btn" id="send-btn" onclick="sendReset()">リセットメールを送信</button>
    <div class="msg" id="msg"></div>
    <div class="back" onclick="window.location.href='index.html'">← ログインに戻る</div>
  </div>

  <!-- ステップ2：新パスワード設定（リセットリンクから来た場合） -->
  <div id="new-pw-form">
    <p class="sub">新しいパスワードを設定してください。</p>
    <label>新しいパスワード</label>
    <input type="password" id="new-pw" placeholder="8文字以上">
    <label>確認用パスワード</label>
    <input type="password" id="new-pw2" placeholder="もう一度入力">
    <button class="btn" id="update-btn" onclick="updatePassword()">パスワードを更新</button>
    <div class="msg" id="msg2"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SURL='https://hyvjvcdahahrznhujtaz.supabase.co';
var SKEY='SUPABASE_ANON_KEY';
var sb=window.supabase.createClient(SURL,SKEY);

// URLにtokenが含まれている場合は新パスワード設定フォームを表示
async function init(){
  var hash=window.location.hash;
  if(hash.includes('type=recovery')){
    document.getElementById('email-form').style.display='none';
    document.getElementById('new-pw-form').style.display='block';
  }
}

async function sendReset(){
  var em=document.getElementById('em').value.trim();
  var msg=document.getElementById('msg');
  var btn=document.getElementById('send-btn');
  if(!em){msg.className='msg err';msg.textContent='メールアドレスを入力してください';return;}
  btn.disabled=true;
  var {error}=await sb.auth.resetPasswordForEmail(em,{
    redirectTo: 'https://tamulab-jp.github.io/tenko-saas/reset.html'
  });
  if(error){msg.className='msg err';msg.textContent='エラー: '+error.message;btn.disabled=false;return;}
  msg.className='msg ok';
  msg.textContent='リセットメールを送信しました。メールをご確認ください。';
  btn.disabled=false;
}

async function updatePassword(){
  var pw=document.getElementById('new-pw').value;
  var pw2=document.getElementById('new-pw2').value;
  var msg=document.getElementById('msg2');
  var btn=document.getElementById('update-btn');
  if(!pw||!pw2){msg.className='msg err';msg.textContent='パスワードを入力してください';return;}
  if(pw!==pw2){msg.className='msg err';msg.textContent='パスワードが一致しません';return;}
  if(pw.length<8){msg.className='msg err';msg.textContent='8文字以上で入力してください';return;}
  btn.disabled=true;
  var {error}=await sb.auth.updateUser({password:pw});
  if(error){msg.className='msg err';msg.textContent='エラー: '+error.message;btn.disabled=false;return;}
  msg.className='msg ok';
  msg.textContent='パスワードを更新しました！ログイン画面に移動します...';
  setTimeout(()=>window.location.href='index.html',2000);
}

init();
</script>
</body>
</html>
