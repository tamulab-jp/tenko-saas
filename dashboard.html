<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点呼SaaS — ダッシュボード</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hiragino Sans',sans-serif;background:#f0f4fa;min-height:100vh;color:#0f1c35}
.header{background:#fff;border-bottom:1px solid #e2e8f4;padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:12px}
.logo{font-size:.95rem;font-weight:700;color:#0f1c35}
.company-badge{background:#e8f0fe;color:#1a5cd4;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:20px}
.code-badge{background:#f0f4fa;color:#7a8a9e;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;cursor:pointer}
.logout-btn{background:none;border:1px solid #d8e2f0;border-radius:8px;padding:6px 14px;font-size:.82rem;color:#5a6a82;cursor:pointer}
.main{max-width:900px;margin:0 auto;padding:1.5rem 1rem}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#fff;border-radius:12px;border:1px solid #e2e8f4;padding:1.25rem}
.stat-label{font-size:.75rem;color:#7a8a9e;margin-bottom:6px}
.stat-value{font-size:1.6rem;font-weight:700}
.stat-sub{font-size:.75rem;color:#7a8a9e;margin-top:4px}
.stat-card.green .stat-value{color:#1d9e75}
.stat-card.blue .stat-value{color:#1a5cd4}
.stat-card.orange .stat-value{color:#d97706}

.section{background:#fff;border-radius:12px;border:1px solid #e2e8f4;margin-bottom:1.5rem;overflow:hidden}
.section-header{padding:1rem 1.25rem;border-bottom:1px solid #f0f4fa;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.section-title{font-size:.9rem;font-weight:700}
.date-nav{display:flex;align-items:center;gap:.5rem}
.date-btn{background:#f0f4fa;border:1px solid #d8e2f0;border-radius:6px;padding:4px 10px;font-size:.78rem;cursor:pointer}
.date-label{font-size:.82rem;font-weight:600;color:#0f1c35}

.tenko-table{width:100%;border-collapse:collapse}
.tenko-table th{font-size:.75rem;color:#7a8a9e;font-weight:600;padding:.75rem 1rem;text-align:left;border-bottom:1px solid #f0f4fa;background:#fafbfd;white-space:nowrap}
.tenko-table td{font-size:.82rem;color:#0f1c35;padding:.85rem 1rem;border-bottom:1px solid #f8f9fc;white-space:nowrap}
.tenko-table tr:last-child td{border-bottom:none}
.tenko-table tr:hover td{background:#fafbfd}

.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.done{background:#dcfce7;color:#166534}
.badge.none{background:#f3f4f6;color:#9ca3af}
.badge.face{background:#e8f0fe;color:#1a5cd4}
.badge.phone{background:#f3e8ff;color:#7c3aed}
.badge.it{background:#fef3c7;color:#92400e}

.tenko-btn{background:#f0f4fa;border:1px solid #d8e2f0;border-radius:6px;padding:5px 10px;font-size:.75rem;color:#1a5cd4;cursor:pointer;font-weight:600;margin-right:4px}
.edit-btn{background:#f0f4fa;border:1px solid #d8e2f0;border-radius:6px;padding:5px 10px;font-size:.75rem;color:#5a6a82;cursor:pointer;font-weight:600;margin-right:4px}
.del-btn{background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;padding:5px 10px;font-size:.75rem;color:#991b1b;cursor:pointer;font-weight:600}

.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;padding:1rem}
.action-card{border:1px solid #e2e8f4;border-radius:10px;padding:1rem;cursor:pointer;transition:all .15s}
.action-card:hover{border-color:#1a5cd4;background:#f0f4fa}
.action-icon{font-size:1.4rem;margin-bottom:.5rem}
.action-title{font-size:.85rem;font-weight:700;margin-bottom:2px}
.action-desc{font-size:.75rem;color:#7a8a9e}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:90%;max-width:400px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:1rem;font-weight:700;margin-bottom:.25rem}
.modal-sub{font-size:.8rem;color:#7a8a9e;margin-bottom:1.25rem}
.modal label{font-size:.82rem;color:#5a6a82;display:block;margin-bottom:4px}
.modal input{width:100%;border:1px solid #d8e2f0;border-radius:8px;padding:10px 12px;font-size:.88rem;margin-bottom:1rem;outline:none}
.modal-btns{display:flex;gap:.75rem}
.modal-btns button{flex:1;padding:10px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer}
.modal-cancel{background:#f0f4fa;border:1px solid #d8e2f0;color:#5a6a82}
.modal-submit{background:#1a5cd4;border:none;color:#fff}
.modal-delete{background:#e24b4a;border:none;color:#fff}
.modal-msg{font-size:.8rem;color:#e24b4a;margin-top:.5rem;text-align:center}
.code-info{background:#f7f9fc;border:1px solid #e2e8f4;border-radius:8px;padding:.75rem 1rem;margin-bottom:1rem;font-size:.82rem;color:#5a6a82}
.code-value{font-size:1.1rem;font-weight:700;color:#1a5cd4;letter-spacing:2px;margin-top:4px}
.loading{padding:2rem;text-align:center;color:#7a8a9e;font-size:.85rem}
.empty{padding:2rem;text-align:center;color:#7a8a9e;font-size:.85rem}
.driver-info-row{font-size:.75rem;color:#7a8a9e;margin-top:2px}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <span class="logo">点呼管理システム</span>
    <span class="company-badge" id="company-name">読込中...</span>
    <span class="code-badge" onclick="showCodeModal()">🔑 コード確認</span>
  </div>
  <button class="logout-btn" onclick="logout()">ログアウト</button>
</div>

<div class="main">
  <div class="stat-grid">
    <div class="stat-card green">
      <div class="stat-label">今日の点呼完了</div>
      <div class="stat-value" id="stat-done">-</div>
      <div class="stat-sub">ドライバー×区分でカウント</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">登録ドライバー数</div>
      <div class="stat-value" id="stat-drivers">-</div>
      <div class="stat-sub">アクティブ</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-label">未完了</div>
      <div class="stat-value" id="stat-pending">-</div>
      <div class="stat-sub">本日分</div>
    </div>
  </div>

  <!-- 点呼状況 -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">点呼状況</span>
      <div class="date-nav">
        <button class="date-btn" onclick="changeDate(-1)">◀</button>
        <span class="date-label" id="date-label">-</span>
        <button class="date-btn" onclick="changeDate(1)">▶</button>
      </div>
    </div>
    <div style="overflow-x:auto">
      <div id="tenko-status-list"><div class="loading">読込中...</div></div>
    </div>
  </div>

  <!-- ドライバー一覧 -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">ドライバー一覧</span>
    </div>
    <div id="driver-list"><div class="loading">読込中...</div></div>
  </div>

  <!-- クイックアクション -->
  <div class="section">
    <div class="section-header"><span class="section-title">クイックアクション</span></div>
    <div class="action-grid">
      <div class="action-card" onclick="window.location.href='tenko.html'">
        <div class="action-icon">📋</div>
        <div class="action-title">点呼を記録する</div>
        <div class="action-desc">対面・電話点呼の入力</div>
      </div>
      <div class="action-card" onclick="window.location.href='records.html'">
        <div class="action-icon">📊</div>
        <div class="action-title">点呼記録を見る</div>
        <div class="action-desc">過去の記録・CSV出力</div>
      </div>
      <div class="action-card" onclick="showCodeModal()">
        <div class="action-icon">🔑</div>
        <div class="action-title">会社コードを確認</div>
        <div class="action-desc">ドライバー登録用コード</div>
      </div>
      <div class="action-card" onclick="window.location.href='tenko.html'">
        <div class="action-icon">✏️</div>
        <div class="action-title">ドライバー情報を編集</div>
        <div class="action-desc">ドライバー情報の変更</div>
      </div>
    </div>
  </div>
</div>

<!-- ドライバー編集モーダル -->
<div class="overlay" id="driver-modal">
  <div class="modal">
    <h2 id="modal-title">ドライバー情報を編集</h2>
    <p class="modal-sub" id="modal-driver-name"></p>
    <input type="hidden" id="edit-driver-id">
    <label>氏名</label>
    <input type="text" id="d-name" placeholder="例：田村 守">
    <label>電話番号</label>
    <input type="tel" id="d-phone" placeholder="例：090-1234-5678">
    <label>車両番号</label>
    <input type="text" id="d-vehicle" placeholder="例：横浜 100 あ 1234">
    <label>連絡用メールアドレス</label>
    <input type="email" id="d-email" placeholder="例：driver@example.com">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeDriverModal()">キャンセル</button>
      <button class="modal-submit" onclick="saveDriver()">保存する</button>
    </div>
    <div style="margin-top:.75rem">
      <button class="modal-delete" style="width:100%;padding:10px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer" onclick="deleteDriver()">このドライバーを削除する</button>
    </div>
    <div class="modal-msg" id="d-msg"></div>
  </div>
</div>

<!-- 会社コードモーダル -->
<div class="overlay" id="code-modal">
  <div class="modal">
    <h2>🔑 会社コード</h2>
    <div class="code-info">
      ドライバーが新規登録する際に必要なコードです。
      <div class="code-value" id="code-display">-</div>
    </div>
    <div class="modal-btns">
      <button class="modal-submit" onclick="document.getElementById('code-modal').classList.remove('show')">閉じる</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SURL='https://hyvjvcdahahrznhujtaz.supabase.co ';
var SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5dmp2Y2RhaGFocnpuaHVqdGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NTE3MDcsImV4cCI6MjA5NTQyNzcwN30.Zdl8yaFH64xEbiEzi7v8dsd2iu3CKaH96TBNqigJZV4';
var sb=window.supabase.createClient(SURL,SKEY);
var companyId=null;
var userId=null;
var companyCode=null;
var currentDate=new Date();

function getTodayJST(){
  var now=new Date();
  var jst=new Date(now.getTime()+9*60*60*1000);
  return jst.toISOString().split('T')[0];
}
function formatDate(d){
  var jst=new Date(d.getTime()+9*60*60*1000);
  return jst.toISOString().split('T')[0];
}
function formatDateJa(d){
  var jst=new Date(d.getTime()+9*60*60*1000);
  return jst.getFullYear()+'/'+(jst.getMonth()+1).toString().padStart(2,'0')+'/'+jst.getDate().toString().padStart(2,'0');
}

async function init(){
  var {data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='index.html';return;}
  userId=session.user.id;
  var {data:profile}=await sb.from('tk_user_profiles').select('company_id,role').eq('id',userId).single();
  if(!profile){window.location.href='index.html';return;}
  if(profile.role==='driver'){window.location.href='driver.html';return;}
  companyId=profile.company_id;
  var {data:company}=await sb.from('tk_companies').select('name,company_code,status,trial_ends_at').eq('id',companyId).single();
  if(!company){window.location.href='index.html';return;}
  // 課金ゲート：利用停止・試用期限切れなら強制ログアウト
  if(company.status==='suspended'||(company.status==='trial'&&company.trial_ends_at&&new Date(company.trial_ends_at)<new Date())){
    await sb.auth.signOut();
    window.location.href='index.html';return;
  }
  document.getElementById('company-name').textContent=company.name;
  companyCode=company.company_code;
  document.getElementById('code-display').textContent=companyCode||'未設定';
  document.getElementById('date-label').textContent=formatDateJa(currentDate);
  loadTenkoStatus();
  loadDrivers();
  loadStats();
}

function changeDate(d){
  currentDate.setDate(currentDate.getDate()+d);
  document.getElementById('date-label').textContent=formatDateJa(currentDate);
  loadTenkoStatus();
}

async function loadTenkoStatus(){
  var dateStr=formatDate(currentDate);
  var {data:drivers}=await sb.from('tk_drivers').select('id,name,vehicle_number').eq('company_id',companyId).order('name');
  var {data:records}=await sb.from('tk_tenko_records').select('*').eq('company_id',companyId).eq('date',dateStr).order('created_at',{ascending:false});
  var el=document.getElementById('tenko-status-list');
  if(!drivers||drivers.length===0){el.innerHTML='<div class="empty">ドライバーが登録されていません</div>';return;}

  var rows=drivers.map(d=>{
    var before=records&&records.find(r=>r.driver_id===d.id&&r.tenko_type==='乗務前');
    var after=records&&records.find(r=>r.driver_id===d.id&&r.tenko_type==='乗務後');
    function methodBadge(r){
      if(!r) return '<span class="badge none">未実施</span>';
      var m=r.method||'IT点呼';
      var cls=m==='対面'?'face':m==='電話'?'phone':'it';
      return `<span class="badge ${cls}">${m}</span>`;
    }
    function alcDisplay(r){
      if(!r) return '-';
      var v=parseFloat(r.alcohol_value)||0;
      return v>=0.15?`<span style="color:#e24b4a;font-weight:700">${v.toFixed(2)}</span>`:v.toFixed(2);
    }
    return `<tr>
      <td><strong>${d.name}</strong></td>
      <td>${d.vehicle_number||'-'}</td>
      <td>${methodBadge(before)}</td>
      <td>${alcDisplay(before)}</td>
      <td>${before?before.health_status||'-':'-'}</td>
      <td>${methodBadge(after)}</td>
      <td>${alcDisplay(after)}</td>
      <td>${after?after.health_status||'-':'-'}</td>
      <td><button class="tenko-btn" onclick="window.location.href='tenko.html?driver=${d.id}'">入力</button></td>
    </tr>`;
  }).join('');

  el.innerHTML=`<table class="tenko-table">
    <thead><tr>
      <th>ドライバー</th><th>車両</th>
      <th>乗務前方法</th><th>乗務前Alc</th><th>乗務前健康</th>
      <th>乗務後方法</th><th>乗務後Alc</th><th>乗務後健康</th>
      <th>操作</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function loadStats(){
  var today=getTodayJST();
  var {data:drivers}=await sb.from('tk_drivers').select('id').eq('company_id',companyId);
  var driverCount=drivers?drivers.length:0;
  document.getElementById('stat-drivers').textContent=driverCount;
  var {data:records}=await sb.from('tk_tenko_records').select('driver_id,tenko_type').eq('company_id',companyId).eq('date',today);
  var unique=new Set();
  if(records) records.forEach(r=>unique.add(r.driver_id+'_'+r.tenko_type));
  var done=unique.size;
  document.getElementById('stat-done').textContent=done;
  document.getElementById('stat-pending').textContent=Math.max(0,driverCount*2-done);
}

async function loadDrivers(){
  var {data:drivers}=await sb.from('tk_drivers').select('*').eq('company_id',companyId).order('name');
  var el=document.getElementById('driver-list');
  if(!drivers||drivers.length===0){el.innerHTML='<div class="empty">ドライバーがまだ登録されていません</div>';return;}

  var today=getTodayJST();
  var {data:records}=await sb.from('tk_tenko_records').select('driver_id,tenko_type').eq('company_id',companyId).eq('date',today);

  var rows=drivers.map(d=>{
    var hasBefore=records&&records.some(r=>r.driver_id===d.id&&r.tenko_type==='乗務前');
    var hasAfter=records&&records.some(r=>r.driver_id===d.id&&r.tenko_type==='乗務後');
    var statusBadge;
    if(hasAfter){
      statusBadge='<span class="badge" style="background:#f3f4f6;color:#6b7280">業務終了</span>';
    } else if(hasBefore){
      statusBadge='<span class="badge done">稼働中</span>';
    } else {
      statusBadge='<span class="badge" style="background:#fef3c7;color:#92400e">待機中</span>';
    }
    var setupAlert=!d.phone?'<span style="color:#e24b4a;font-size:.72rem">⚠️ 電話番号未設定</span>':'';
    return `<tr>
      <td>
        <div>${d.name||'-'}</div>
        <div class="driver-info-row">${d.phone||'電話番号未設定'} ${setupAlert}</div>
        <div class="driver-info-row">${d.vehicle_number||'車両番号未設定'}</div>
        <div class="driver-info-row">${d.contact_email||''}</div>
      </td>
      <td>${statusBadge}</td>
      <td>
        <button class="edit-btn" onclick="openDriverModal('${d.id}','${d.name||''}','${d.phone||''}','${d.vehicle_number||''}','${d.contact_email||''}')">編集</button>
      </td>
    </tr>`;
  }).join('');

  el.innerHTML=`<table class="tenko-table">
    <thead><tr><th>ドライバー情報</th><th>状態</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function openDriverModal(id,name,phone,vehicle,email){
  document.getElementById('edit-driver-id').value=id;
  document.getElementById('modal-driver-name').textContent=name+'の情報を編集';
  document.getElementById('d-name').value=name;
  document.getElementById('d-phone').value=phone;
  document.getElementById('d-vehicle').value=vehicle;
  document.getElementById('d-email').value=email;
  document.getElementById('d-msg').textContent='';
  document.getElementById('driver-modal').classList.add('show');
}

function closeDriverModal(){
  document.getElementById('driver-modal').classList.remove('show');
}

async function saveDriver(){
  var id=document.getElementById('edit-driver-id').value;
  var name=document.getElementById('d-name').value.trim();
  var phone=document.getElementById('d-phone').value.trim();
  var vehicle=document.getElementById('d-vehicle').value.trim();
  var email=document.getElementById('d-email').value.trim();
  var msg=document.getElementById('d-msg');
  if(!name){msg.textContent='氏名を入力してください';return;}
  var {error}=await sb.from('tk_drivers').update({name:name,phone:phone,vehicle_number:vehicle,contact_email:email}).eq('id',id);
  if(error){msg.textContent='エラー: '+error.message;return;}
  closeDriverModal();
  loadDrivers();
  loadStats();
  loadTenkoStatus();
}

async function deleteDriver(){
  var id=document.getElementById('edit-driver-id').value;
  var name=document.getElementById('d-name').value;
  if(!confirm(name+'を削除しますか？この操作は元に戻せません。')){return;}
  var {error}=await sb.from('tk_drivers').delete().eq('id',id);
  if(error){document.getElementById('d-msg').textContent='エラー: '+error.message;return;}
  closeDriverModal();
  loadDrivers();
  loadStats();
  loadTenkoStatus();
}

function showCodeModal(){document.getElementById('code-modal').classList.add('show');}
async function logout(){await sb.auth.signOut();window.location.href='index.html';}
init();
</script>
</body>
</html>
