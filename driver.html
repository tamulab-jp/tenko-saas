<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点呼入力</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hiragino Sans',sans-serif;background:#f0f4fa;min-height:100vh;color:#0f1c35}
.header{background:#1a5cd4;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-title{font-size:1rem;font-weight:700;color:#fff}
.header-name{font-size:.8rem;color:rgba(255,255,255,.8)}
.header-right{display:flex;gap:.5rem}
.setting-btn{background:rgba(255,255,255,.2);border:none;border-radius:6px;padding:5px 12px;font-size:.78rem;color:#fff;cursor:pointer}
.logout-btn{background:rgba(255,255,255,.2);border:none;border-radius:6px;padding:5px 12px;font-size:.78rem;color:#fff;cursor:pointer}
.main{max-width:480px;margin:0 auto;padding:1rem}

/* 設定促進バナー */
.setup-banner{background:#fee2e2;border:1px solid #fca5a5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;text-align:center}
.setup-banner-title{font-size:.9rem;font-weight:700;color:#991b1b;margin-bottom:.5rem}
.setup-banner-desc{font-size:.8rem;color:#991b1b;margin-bottom:.75rem}
.setup-banner-btn{background:#e24b4a;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:.85rem;font-weight:700;cursor:pointer}

.status-bar{background:#fff;border-radius:12px;border:1px solid #e2e8f4;padding:1rem 1.25rem;margin-bottom:1rem}
.status-title{font-size:.78rem;font-weight:700;color:#7a8a9e;margin-bottom:.75rem}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.status-item{text-align:center;padding:.75rem;border-radius:8px;background:#f7f9fc}
.status-item.done{background:#dcfce7}
.status-item.pending{background:#fef3c7}
.status-label{font-size:.72rem;color:#7a8a9e;margin-bottom:4px}
.status-value{font-size:.85rem;font-weight:700}
.status-item.done .status-value{color:#166534}
.status-item.pending .status-value{color:#92400e}

.card{background:#fff;border-radius:12px;border:1px solid #e2e8f4;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:.82rem;font-weight:700;color:#7a8a9e;margin-bottom:1rem;text-transform:uppercase;letter-spacing:.5px}

.type-btns{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
.type-btn{padding:14px;border-radius:10px;border:2px solid #e2e8f4;background:#fafbfd;cursor:pointer;text-align:center;transition:all .15s}
.type-btn.active{border-color:#1a5cd4;background:#e8f0fe}
.type-btn-icon{font-size:1.4rem;margin-bottom:4px}
.type-btn-label{font-size:.85rem;font-weight:700;color:#0f1c35}
.type-btn-sub{font-size:.72rem;color:#7a8a9e}

label{font-size:.85rem;color:#5a6a82;display:block;margin-bottom:5px}
input[type=number],input[type=text],input[type=email],input[type=tel],textarea{width:100%;border:1px solid #d8e2f0;border-radius:8px;padding:10px 12px;font-size:.9rem;color:#0f1c35;outline:none;background:#fff;margin-bottom:1rem}
textarea{resize:vertical;min-height:70px}

.alcohol-row{display:flex;gap:.75rem;align-items:flex-end;margin-bottom:1rem}
.alcohol-row>div:first-child{flex:1}
.alcohol-row>div:last-child{margin-bottom:1rem}
.alcohol-row input{margin-bottom:0}
.alc-badge{display:inline-block;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:700}
.alc-badge.ok{background:#dcfce7;color:#166534}
.alc-badge.ng{background:#fee2e2;color:#991b1b}

.radio-group{display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.radio-btn{padding:8px 14px;border-radius:8px;border:1px solid #d8e2f0;background:#fafbfd;cursor:pointer;font-size:.82rem;font-weight:600;color:#5a6a82}
.radio-btn.active{border-color:#1a5cd4;background:#e8f0fe;color:#1a5cd4}
.radio-btn.ng-active{border-color:#e24b4a;background:#fee2e2;color:#e24b4a}

.submit-btn{width:100%;background:#1a5cd4;color:#fff;border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.5rem}
.submit-btn:disabled{opacity:.6}

.msg{font-size:.85rem;text-align:center;margin-top:1rem;padding:.75rem;border-radius:8px}
.msg.ok{background:#dcfce7;color:#166534}
.msg.err{background:#fee2e2;color:#991b1b}

.today-section{background:#fff;border-radius:12px;border:1px solid #e2e8f4;overflow:hidden;margin-bottom:1rem}
.today-header{padding:.75rem 1.25rem;border-bottom:1px solid #f0f4fa;font-size:.85rem;font-weight:700}
.today-item{padding:1rem 1.25rem;border-bottom:1px solid #f8f9fc}
.today-item:last-child{border-bottom:none}
.today-type{font-size:.82rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:.5rem}
.today-detail{font-size:.78rem;color:#7a8a9e;line-height:1.8}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.before{background:#e8f0fe;color:#1a5cd4}
.badge.after{background:#f3e8ff;color:#7c3aed}
.badge.done{background:#dcfce7;color:#166534}
.empty{padding:1.5rem;text-align:center;color:#7a8a9e;font-size:.82rem}
.loading{padding:2rem;text-align:center;color:#7a8a9e;font-size:.85rem}

/* モーダル */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:90%;max-width:360px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.modal-desc{font-size:.8rem;color:#7a8a9e;margin-bottom:1.25rem}
.required{color:#e24b4a;font-size:.75rem;margin-left:4px}
.modal-btns{display:flex;gap:.75rem;margin-top:.5rem}
.modal-btns button{flex:1;padding:10px;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer}
.modal-cancel{background:#f0f4fa;border:1px solid #d8e2f0;color:#5a6a82}
.modal-submit{background:#1a5cd4;border:none;color:#fff}
.modal-msg{font-size:.8rem;color:#e24b4a;margin-top:.5rem;text-align:center}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">点呼入力</div>
    <div class="header-name" id="driver-name-header">読込中...</div>
  </div>
  <div class="header-right">
    <button class="setting-btn" onclick="openSetting()">⚙️ 設定</button>
    <button class="logout-btn" onclick="logout()">ログアウト</button>
  </div>
</div>

<div class="main">

  <!-- 設定促進バナー（電話番号未設定時） -->
  <div class="setup-banner" id="setup-banner" style="display:none">
    <div class="setup-banner-title">⚠️ 初期設定が必要です</div>
    <div class="setup-banner-desc">点呼を送信する前に電話番号を設定してください</div>
    <button class="setup-banner-btn" onclick="openSetting()">今すぐ設定する</button>
  </div>

  <!-- 今日の状況 -->
  <div class="status-bar">
    <div class="status-title">今日の点呼状況</div>
    <div class="status-grid">
      <div class="status-item" id="status-before">
        <div class="status-label">乗務前点呼</div>
        <div class="status-value" id="before-status">未完了</div>
      </div>
      <div class="status-item" id="status-after">
        <div class="status-label">乗務後点呼</div>
        <div class="status-value" id="after-status">未完了</div>
      </div>
    </div>
  </div>

  <!-- 点呼入力フォーム -->
  <div class="card" id="tenko-card">
    <div class="card-title">点呼を記録する</div>

    <div class="type-btns">
      <div class="type-btn active" id="btn-before" onclick="setType('before')">
        <div class="type-btn-icon">🌅</div>
        <div class="type-btn-label">乗務前</div>
        <div class="type-btn-sub">出発前</div>
      </div>
      <div class="type-btn" id="btn-after" onclick="setType('after')">
        <div class="type-btn-icon">🌙</div>
        <div class="type-btn-label">乗務後</div>
        <div class="type-btn-sub">帰着後</div>
      </div>
    </div>

    <div class="alcohol-row">
      <div>
        <label>アルコール検知値（mg/L）</label>
        <input type="number" id="alcohol-val" placeholder="0.00" step="0.01" min="0" oninput="checkAlcohol()">
      </div>
      <div><span class="alc-badge ok" id="alc-badge">正常</span></div>
    </div>

    <label>メーター値（km）</label>
    <input type="number" id="meter-val" placeholder="例：12345">

    <label>健康状態</label>
    <div class="radio-group">
      <div class="radio-btn active" id="h-good" onclick="setHealth('良好')">良好</div>
      <div class="radio-btn" id="h-normal" onclick="setHealth('普通')">普通</div>
      <div class="radio-btn" id="h-bad" onclick="setHealth('不良')">不良</div>
    </div>

    <label>疲労・睡眠</label>
    <div class="radio-group">
      <div class="radio-btn active" id="f-good" onclick="setFatigue('問題なし')">問題なし</div>
      <div class="radio-btn" id="f-tired" onclick="setFatigue('やや疲労')">やや疲労</div>
      <div class="radio-btn" id="f-bad" onclick="setFatigue('疲労あり')">疲労あり</div>
    </div>

    <label>特記事項</label>
    <textarea id="notes" placeholder="特記事項があれば入力してください"></textarea>

    <button class="submit-btn" id="submit-btn" onclick="submitTenko()">点呼を送信する</button>
    <div class="msg" id="msg" style="display:none"></div>
  </div>

  <!-- 今日の記録 -->
  <div class="today-section">
    <div class="today-header">今日の点呼記録</div>
    <div id="today-list"><div class="loading">読込中...</div></div>
  </div>

</div>

<!-- 設定モーダル -->
<div class="overlay" id="setting-modal">
  <div class="modal">
    <h2>⚙️ ドライバー設定</h2>
    <p class="modal-desc">情報を入力して保存してください</p>
    <label>電話番号 <span class="required">※必須</span></label>
    <input type="tel" id="s-phone" placeholder="例：090-1234-5678">
    <label>車両番号</label>
    <input type="text" id="s-vehicle" placeholder="例：横浜 100 あ 1234">
    <label>連絡用メールアドレス</label>
    <input type="email" id="s-email" placeholder="例：driver@example.com">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeSetting()">キャンセル</button>
      <button class="modal-submit" onclick="saveSetting()">保存する</button>
    </div>
    <div class="modal-msg" id="s-msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SURL='https://hyvjvcdahahrznhujtaz.supabase.co ';
var SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5dmp2Y2RhaGFocnpuaHVqdGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NTE3MDcsImV4cCI6MjA5NTQyNzcwN30.Zdl8yaFH64xEbiEzi7v8dsd2iu3CKaH96TBNqigJZV4';
var sb=window.supabase.createClient(SURL,SKEY);

var userId=null;
var companyId=null;
var driverId=null;
var driverData=null;
var tenkoType='before';
var healthStatus='良好';
var fatigueStatus='問題なし';
var todayRecords={before:null,after:null};
var isSetupComplete=false;

function getTodayJST(){
  var now=new Date();
  var jst=new Date(now.getTime()+9*60*60*1000);
  return jst.toISOString().split('T')[0];
}

async function init(){
  var {data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='index.html';return;}
  userId=session.user.id;
  var {data:profile}=await sb.from('user_profiles').select('company_id,role,driver_name').eq('id',userId).single();
  if(!profile||profile.role!=='driver'){window.location.href='index.html';return;}
  companyId=profile.company_id;
  document.getElementById('driver-name-header').textContent=profile.driver_name||'ドライバー';

  var {data:driver}=await sb.from('drivers').select('*').eq('user_id',userId).single();
  if(driver){
    driverId=driver.id;
    driverData=driver;
    isSetupComplete=!!(driver.phone);
  }

  // 電話番号未設定の場合バナー表示・送信ブロック
  if(!isSetupComplete){
    document.getElementById('setup-banner').style.display='block';
    document.getElementById('submit-btn').disabled=true;
  }

  loadToday();
}

async function loadToday(){
  var today=getTodayJST();
  var {data:records}=await sb.from('tenko_records').select('*').eq('driver_id',driverId).eq('date',today).order('created_at',{ascending:false});

  todayRecords.before=records&&records.find(r=>r.tenko_type==='乗務前')||null;
  todayRecords.after=records&&records.find(r=>r.tenko_type==='乗務後')||null;

  var beforeDone=!!todayRecords.before;
  var afterDone=!!todayRecords.after;
  document.getElementById('before-status').textContent=beforeDone?'完了':'未完了';
  document.getElementById('after-status').textContent=afterDone?'完了':'未完了';
  document.getElementById('status-before').className='status-item'+(beforeDone?' done':' pending');
  document.getElementById('status-after').className='status-item'+(afterDone?' done':' pending');

  var el=document.getElementById('today-list');
  var items=[todayRecords.before,todayRecords.after].filter(Boolean);
  if(items.length===0){el.innerHTML='<div class="empty">まだ記録がありません</div>';return;}

  el.innerHTML=items.map(r=>{
    var typeBadge=r.tenko_type==='乗務前'?'<span class="badge before">乗務前</span>':'<span class="badge after">乗務後</span>';
    var time=r.created_at?new Date(r.created_at).toLocaleString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="today-item">
      <div class="today-type">${typeBadge} <span class="badge done">送信済</span></div>
      <div class="today-detail">
        アルコール: ${r.alcohol_value||0} mg/L　健康: ${r.health_status||'-'}　疲労: ${r.fatigue_status||'-'}<br>
        メーター: ${r.meter_value||'-'} km　送信時刻: ${time}
        ${r.notes?'<br>特記: '+r.notes:''}
      </div>
    </div>`;
  }).join('');
}

function setType(t){
  tenkoType=t;
  document.getElementById('btn-before').classList.toggle('active',t==='before');
  document.getElementById('btn-after').classList.toggle('active',t==='after');
}

function checkAlcohol(){
  var v=parseFloat(document.getElementById('alcohol-val').value)||0;
  var badge=document.getElementById('alc-badge');
  if(v>=0.15){badge.className='alc-badge ng';badge.textContent='要確認';}
  else{badge.className='alc-badge ok';badge.textContent='正常';}
}

function setHealth(v){
  healthStatus=v;
  ['h-good','h-normal','h-bad'].forEach(id=>document.getElementById(id).className='radio-btn');
  var map={'良好':'h-good','普通':'h-normal','不良':'h-bad'};
  document.getElementById(map[v]).className=v==='不良'?'radio-btn ng-active':'radio-btn active';
}

function setFatigue(v){
  fatigueStatus=v;
  ['f-good','f-tired','f-bad'].forEach(id=>document.getElementById(id).className='radio-btn');
  var map={'問題なし':'f-good','やや疲労':'f-tired','疲労あり':'f-bad'};
  document.getElementById(map[v]).className=v==='疲労あり'?'radio-btn ng-active':'radio-btn active';
}

async function submitTenko(){
  if(!isSetupComplete){
    document.getElementById('setup-banner').style.display='block';
    return;
  }
  var btn=document.getElementById('submit-btn');
  var msg=document.getElementById('msg');
  btn.disabled=true;

  var today=getTodayJST();
  var ttype=tenkoType==='before'?'乗務前':'乗務後';
  var existingRecord=tenkoType==='before'?todayRecords.before:todayRecords.after;

  var record={
    tenko_type:ttype,
    method:'IT点呼',
    alcohol_value:parseFloat(document.getElementById('alcohol-val').value)||0,
    meter_value:parseInt(document.getElementById('meter-val').value)||null,
    health_status:healthStatus,
    fatigue_status:fatigueStatus,
    notes:document.getElementById('notes').value,
    status:'完了',
    modified_at:new Date().toISOString(),
  };

  var error;
  if(existingRecord){
    record.is_modified=true;
    var res=await sb.from('tenko_records').update(record).eq('id',existingRecord.id);
    error=res.error;
  } else {
    record.company_id=companyId;
    record.driver_id=driverId;
    record.recorded_by=userId;
    record.date=today;
    record.is_modified=false;
    var res2=await sb.from('tenko_records').insert(record);
    error=res2.error;
  }

  if(error){
    msg.textContent='エラー: '+error.message;
    msg.className='msg err';msg.style.display='block';
    btn.disabled=false;return;
  }

  msg.textContent=existingRecord?'送信し直しました！':'点呼を送信しました！';
  msg.className='msg ok';msg.style.display='block';
  document.getElementById('alcohol-val').value='';
  document.getElementById('meter-val').value='';
  document.getElementById('notes').value='';
  checkAlcohol();setHealth('良好');setFatigue('問題なし');
  btn.disabled=false;
  loadToday();
  setTimeout(()=>{msg.style.display='none';},3000);
}

function openSetting(){
  // 既存情報をセット
  if(driverData){
    document.getElementById('s-phone').value=driverData.phone||'';
    document.getElementById('s-vehicle').value=driverData.vehicle_number||'';
    document.getElementById('s-email').value=driverData.contact_email||'';
  }
  document.getElementById('s-msg').textContent='';
  document.getElementById('setting-modal').classList.add('show');
}

function closeSetting(){
  document.getElementById('setting-modal').classList.remove('show');
}

async function saveSetting(){
  var phone=document.getElementById('s-phone').value.trim();
  var vehicle=document.getElementById('s-vehicle').value.trim();
  var email=document.getElementById('s-email').value.trim();
  var msg=document.getElementById('s-msg');

  if(!phone){msg.textContent='電話番号は必須です';return;}

  var {data,error}=await sb.from('drivers').update({
    phone:phone,
    vehicle_number:vehicle,
    contact_email:email,
    is_setup_complete:true,
  }).eq('id',driverId).select().single();

  if(error){msg.textContent='エラー: '+error.message;return;}

  driverData=data;
  isSetupComplete=true;
  document.getElementById('setup-banner').style.display='none';
  document.getElementById('submit-btn').disabled=false;
  closeSetting();
}

async function logout(){
  await sb.auth.signOut();
  window.location.href='index.html';
}

init();
</script>
</body>
</html>
