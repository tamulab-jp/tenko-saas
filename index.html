<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点呼SaaS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hiragino Sans',sans-serif;background:#f7f9fc;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.card{background:#fff;border-radius:14px;border:1px solid #e8edf4;padding:2rem 1.5rem;width:100%;max-width:360px}
h1{font-size:1.2rem;font-weight:700;color:#0f1c35;margin-bottom:.25rem}
.sub{font-size:.85rem;color:#7a8a9e;margin-bottom:1.75rem}
label{font-size:.82rem;color:#5a6a82;display:block;margin-bottom:4px}
input{width:100%;border:1px solid #d8e2f0;border-radius:8px;padding:10px 12px;font-size:.9rem;color:#0f1c35;margin-bottom:1rem;outline:none}
.btn{width:100%;background:#1a5cd4;color:#fff;border:none;border-radius:8px;padding:12px;font-size:.95rem;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6}
.msg{font-size:.82rem;margin-top:1rem;text-align:center}
.err{color:#e24b4a}
.ok{color:#1d9e75}
.toggle{font-size:.82rem;color:#1a5cd4;text-align:center;margin-top:1rem;cursor:pointer}
.reset{font-size:.82rem;color:#7a8a9e;text-align:center;margin-top:.5rem;cursor:pointer}
.role-btns{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem}
.role-btn{width:100%;padding:12px;border-radius:10px;border:2px solid #e2e8f4;background:#fafbfd;cursor:pointer;text-align:center;transition:all .15s;font-family:'Hiragino Sans',sans-serif}
.role-btn.active{border-color:#1a5cd4;background:#e8f0fe}
.role-btn-icon{font-size:1.3rem;margin-bottom:4px}
.role-btn-label{font-size:.82rem;font-weight:700;color:#0f1c35}
</style>
</head>
<body>
<div class="card">
  <h1>点呼管理システム</h1>
  <p class="sub" id="lbl">アカウントにログイン</p>

  <!-- 新規登録時のロール選択 -->
  <div id="role-select" style="display:none">
    <label>登録区分</label>
    <div class="role-btns">
      <button type="button" class="role-btn active" id="role-admin" onclick="setRole('admin')">
        <div class="role-btn-icon">🏢</div>
        <div class="role-btn-label">管理者</div>
      </button>
      <button type="button" class="role-btn" id="role-driver" onclick="setRole('driver')">
        <div class="role-btn-icon">🚗</div>
        <div class="role-btn-label">ドライバー</div>
      </button>
    </div>
  </div>

  <!-- 管理者登録：会社名 -->
  <div id="sf-company" style="display:none">
    <label>会社名</label>
    <input type="text" id="cn" placeholder="例：tamlab.jp">
  </div>

  <!-- ドライバー登録：会社コード・氏名 -->
  <div id="sf-driver" style="display:none">
    <label>会社コード</label>
    <input type="text" id="company-code" placeholder="管理者から受け取ったコード" style="text-transform:uppercase">
    <label>氏名</label>
    <input type="text" id="driver-name" placeholder="例：田村 守">
  </div>

  <label>メールアドレス</label>
  <input type="email" id="em" placeholder="example@email.com">
  <label>パスワード</label>
  <input type="password" id="pw" placeholder="8文字以上">
  <button class="btn" id="btn">ログイン</button>
  <div class="msg" id="msg"></div>
  <div class="toggle" id="tgl">アカウントを新規作成</div>
  <div class="reset" onclick="window.location.href='reset.html'">パスワードをお忘れの方</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SURL='https://hyvjvcdahahrznhujtaz.supabase.co';
var SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5dmp2Y2RhaGFocnpuaHVqdGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NTE3MDcsImV4cCI6MjA5NTQyNzcwN30.Zdl8yaFH64xEbiEzi7v8dsd2iu3CKaH96TBNqigJZV4';
var sb=window.supabase.createClient(SURL,SKEY);
var isUp=false;
var selectedRole='admin';

function setRole(role){
  selectedRole=role;
  document.getElementById('role-admin').classList.toggle('active',role==='admin');
  document.getElementById('role-driver').classList.toggle('active',role==='driver');
  document.getElementById('sf-company').style.display=role==='admin'?'block':'none';
  document.getElementById('sf-driver').style.display=role==='driver'?'block':'none';
}

document.getElementById('tgl').addEventListener('click',function(){
  isUp=!isUp;
  document.getElementById('lbl').textContent=isUp?'新規アカウント作成':'アカウントにログイン';
  document.getElementById('btn').textContent=isUp?'登録する':'ログイン';
  document.getElementById('tgl').textContent=isUp?'ログインに戻る':'アカウントを新規作成';
  document.getElementById('role-select').style.display=isUp?'block':'none';
  document.getElementById('sf-company').style.display=isUp&&selectedRole==='admin'?'block':'none';
  document.getElementById('sf-driver').style.display=isUp&&selectedRole==='driver'?'block':'none';
  document.getElementById('msg').textContent='';
});

document.getElementById('btn').addEventListener('click',async function(){
  var em=document.getElementById('em').value.trim();
  var pw=document.getElementById('pw').value;
  var msg=document.getElementById('msg');
  var btn=document.getElementById('btn');
  if(!em||!pw){msg.className='msg err';msg.textContent='入力してください';return;}
  btn.disabled=true;
  msg.textContent='';

  if(isUp){
    if(selectedRole==='admin'){
      var cn=document.getElementById('cn').value.trim();
      if(!cn){msg.className='msg err';msg.textContent='会社名を入力してください';btn.disabled=false;return;}
      var r=await sb.auth.signUp({email:em,password:pw});
      if(r.error){msg.className='msg err';msg.textContent=r.error.message;btn.disabled=false;return;}
      var c=await sb.from('companies').insert({name:cn}).select().single();
      if(c.error){msg.className='msg err';msg.textContent='会社登録エラー: '+c.error.message;btn.disabled=false;return;}
      await sb.from('user_profiles').insert({id:r.data.user.id,company_id:c.data.id,role:'admin'});
      msg.className='msg ok';msg.textContent='登録完了！確認メールを送信しました。';
    } else {
      var code=document.getElementById('company-code').value.trim().toUpperCase();
      var dname=document.getElementById('driver-name').value.trim();
      if(!code){msg.className='msg err';msg.textContent='会社コードを入力してください';btn.disabled=false;return;}
      if(!dname){msg.className='msg err';msg.textContent='氏名を入力してください';btn.disabled=false;return;}
      var {data:company,error:ce}=await sb.from('companies').select('id').eq('company_code',code).maybeSingle();
      if(!company){msg.className='msg err';msg.textContent='会社コードが正しくありません';btn.disabled=false;return;}
      var r2=await sb.auth.signUp({email:em,password:pw});
      if(r2.error){msg.className='msg err';msg.textContent=r2.error.message;btn.disabled=false;return;}
      await sb.from('user_profiles').insert({id:r2.data.user.id,company_id:company.id,role:'driver',driver_name:dname});
      await sb.from('drivers').insert({company_id:company.id,name:dname,user_id:r2.data.user.id});
      msg.className='msg ok';msg.textContent='登録完了！確認メールを送信しました。';
    }
  } else {
    var r3=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r3.error){msg.className='msg err';msg.textContent='メールまたはパスワードが違います';btn.disabled=false;return;}
    var {data:profile}=await sb.from('user_profiles').select('role').eq('id',r3.data.user.id).single();
    if(profile&&profile.role==='driver'){
      window.location.href='driver.html';
    } else {
      window.location.href='dashboard.html';
    }
  }
  btn.disabled=false;
});
</script>
</body>
</html>
